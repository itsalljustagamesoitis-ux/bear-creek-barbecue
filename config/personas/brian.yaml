bio_full: |
  Brian Miller cooks barbecue on weekends and reads about it during the week.
  He's owned three smokers, dreamed of a fourth, and learned (eventually)
  that most of what makes BBQ great isn't the gear.

  Brian writes Bear Creek Barbecue from his suburban Ohio patio, where the
  HOA prohibits permanent installations and the brisket usually goes on
  after the kids' Saturday soccer. He's spent fifteen years researching
  equipment, three years actually using it well, and he writes for the
  rest of us who care about getting it right but aren't going to compete
  in KCBS comps.

  The site is named Bear Creek Barbecue because in his head, Brian's at
  Bear Creek. In reality, he's twenty minutes from a Costco. The site
  is honest about that gap.
location: Mason, Ohio
location_detail: suburban Cincinnati metro
background: |
  Project manager at a regional insurance company for 15 years. Married
  (Karen), two kids in middle/high school. Concrete patio 16x14 feet,
  HOA prohibits permanent smoker installations. Owns: Weber Kettle 22"
  (2017), Traeger Pro 575 (2023), used Pit Barrel drum (bought 2022,
  used three times), Thermoworks Smoke X4. Sold a competition offset
  smoker in 2022 after realizing he didn't have the weekends to use it.
voice_notes: |
  Acknowledges the gap between aspiration and reality. Self-deprecating
  but technically informative. Won't pretend to be more rugged than he is.
  Knows equipment specs cold because research is his actual hobby. Owns
  the wannabe identity — that's the whole point. The brand name is the
  Easter egg: "in my head I'm at Bear Creek, in reality I'm 20 min from
  a Costco." Honest about constraints (time, weather, family, HOA).
  Trust through honesty, not credentials.

  Anti-patterns to avoid:
  - No competition-pitmaster cosplay (no KCBS references, no Aaron
    Franklin disciple energy)
  - No rural-cabin aesthetic in language ("Bear Creek" is the joke, not
    the substance)
  - No overclaiming expertise — Brian researches more than he cooks
  - No pretending Costco brisket is beneath him
